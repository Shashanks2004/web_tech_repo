<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media tags</title>
</head>
<body>
    <h1>Media Tags</h1>

    <>Insertion of image </>

    <img src="https://upload.wikimedia.org/wikipedia/en/4/46/Grand_Theft_Auto_VI.png?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original" alt="No idea man" title="GTA-6">

    <img src="" alt="no image">
    <br>

    <img src="./images/Owl.jpg" alt="No idea man" height="353px" width="282px" title="Owl">

    <img src="./images/Baaaa.jpg" alt="no image" height="353px" width="282px" title="Baaaaaaaaa">

    <img src="./images/Doggy.jpg" alt="no image" height="353px" width="282px" title="Dogesh bhai">

    <img src="./images/erik_karits-baby-monkey-4888534_1920.jpg" alt="no image" height="353px" width="282px" title="Monkey bhaiiii">

    <img src="./images/istockphoto-1154370446-1024x1024.jpg" alt="no image" height="353px" width="282px" title="Youuu">

    <!-- Image tag is an example for unpaired tag -->

    <>Insertion of videos </>

    <video src="./videos/202576-918431455.mp4" height="200" controls ></video>

    <!-- video tag should have controls attribute or else the video will be as image (still image) -->
    <!-- controls will give controls like play the video set it to full view control speed captions forward or reverse the   -->

    <video src="./videos/animals.mp4"height="200" autoplay muted loop ></video>  
     
    <!-- if we want to play a video in a loop that video should be muted and we have to pass attribute as autoplay muted loop -->
    <!-- if we want to autoplay the video with controls we can pass both attributes togethe -->

    <>Insertion of audio </>

    <audio controls src="./audio/artenyo-artenyo-gasoline-309961.mp3"></audio>

    <>Iframes (nested webpages)</>
    
    <!--iframes always has a issues if we try to use best example is gmaps we can use it  -->

    <iframe src="./images/Baaaa.jpg" height="400" width="400"></iframe>

    <br>

    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d248815.91022530542!2d77.45715818569104!3d12.9879250875969!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bae1670c9b44e6d%3A0xf8dfc3e8517e4fe0!2sBengaluru%2C%20Karnataka!5e0!3m2!1sen!2sin!4v1795601363121!5m2!1sen!2sin" width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>


</body>
</html>
