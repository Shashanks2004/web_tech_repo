<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo on attributes </title>
</head>
<body>

    <!-- 
       Attributes:
           Attributes are the properties of HTML elements / It is ued to add additional information for elements 
           Attributes can be written inside the open ta itself with name and value pair

           syntax: 
                <elementName  attributeNAme="attribtesVAlue">
                    content
                </elemntName>
    -->

    <!--style is an attribute used to give css style -->

    <h1 style="color: brown;">
        Demo on Attributes
    </h1>

    <!-- In above example style is an attribute it is used to apply CSS design for single html element -->

    <!-- title is an attribute used to show the additional information like if we place on HTML it will hover and shoes its defiation or additional information-->

    <h2 title="Hyper Text Markup Language">
        HTML
    </h2>

    <!-- In above example title is an attribute it is used to give title name for HTML element -->
     <hr>
     
    <marquee>
        HTML
    </marquee>

    <marquee direction="right">
        CSS
    </marquee>

    <marquee scrollamount="30">
        JAVASCRIPT
    </marquee>

    <marquee direction="up" height="50" bgcolor="skyblue">
       Bye
    </marquee>

    <marquee direction="down" height="50" bgcolor="lavender">
       Hiiii
    </marquee>

    <marquee scrollamount="50" bgcolor="skyblue" behavior="alternate" style="font-size: 50px;">
        🏎️
    </marquee>

    <marquee direction="up" scrollamount="20" bgcolor="skyblue" behavior="alternate" height="100">
        <marquee scrollamount="10" behavior="alternate" >
            🏀
        </marquee>
    </marquee>

    <marquee scrollamount="50" bgcolor="skyblue" behavior="slide" style="font-size: 50px;">
        🏎️
    </marquee>


</body>
</html>
